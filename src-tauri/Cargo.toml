[package]
name = "xenon"
version = "0.2.0"
description = "Xenon - lightweight local-first desktop companion for macOS"
authors = ["Xenon contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[lib]
name = "xenon_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"

# Runtime
tokio = { version = "1.0", features = ["full"] }
async-channel = "2.3"

# Audio
cpal = "0.16"
whisper-rs = { version = "0.16", features = ["metal"] }
sherpa-onnx = "2.0.1"

# Computer control
xcap = "0.9.10"
enigo = "0.6.1"

# HTTP / LLM
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
futures-util = "0.3"
futures-core = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Image processing
image = "0.25"

# Async trait
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# UUID for IDs
uuid = { version = "1.0", features = ["v4"] }

# Date/time for filenames
chrono = "0.4"

# Base64 for images
base64 = "0.22"

# Config directory
dirs = "5.0"

# Version comparison for the in-app update check.
semver = "1.0"

# SHA-256 verification of the downloaded DMG (against the release SHA256SUMS).
sha2 = "0.10"
# API keys in the macOS Keychain (never in config.json).
keyring = "3"

# Global cursor position for click-through hit-testing.
# CGEventGetLocation needs no Accessibility grant (unlike enigo input synthesis).
core-graphics = "0.24"

# macOS permission status: AVFoundation reports the *real* Microphone grant
# (AVCaptureDevice authorizationStatusForMediaType:) and requests it from the
# onboarding/settings button. MIT/Apache; already in the tree via xcap/cpal.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSValue"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "xenon"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
