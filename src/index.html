<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenon</title>
    <link rel="stylesheet" href="/style.css">
    <script>
        // Probe A: proves the HTML loaded and the Tauri global exists,
        // independent of main.js. opaquePixels -1 = HTML only.
        window.addEventListener('load', function () {
            try {
                window.__TAURI__.event.invoke('frontend_ready', {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    opaquePixels: -1
                });
            } catch (e) {
                window.__XENON_PROBE_ERROR__ = String(e);
            }
        });
    </script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script src="/main.js"></script>
</body>
</html>
